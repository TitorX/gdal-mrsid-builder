[project]
name = "gdal-mrsid-builder"
version = "1.0.1"
description = "Auto-downloads and compiles MrSID plugin for GDAL"
requires-python = ">=3.10"

[project.scripts]
build-mrsid = "mrsid_builder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mrsid_builder"]

# Include the bash script as package data
[tool.hatch.build.targets.wheel.force-include]
"mrsid_builder/build_script.sh" = "mrsid_builder/build_script.sh"
