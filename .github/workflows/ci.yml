name: CI & Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  test-pixi:
    name: Test Pixi Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-64
          - os: macos-13
            platform: osx-64
          - os: macos-14
            platform: osx-64
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          run-install: false

      - name: Run Pixi Test
        run: ./tests/test_pixi.sh ${{ matrix.platform }}

  test-conda:
    name: Test Conda Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            subdir: linux-64
          - os: macos-13
            subdir: osx-64
          - os: macos-14
            subdir: osx-64
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          miniconda-version: "latest"
          channels: conda-forge,defaults
          
      - name: Run Conda Test
        shell: bash -l {0}
        run: ./tests/test_conda.sh ${{ matrix.subdir }}

  publish:
    name: Publish to prefix.dev
    needs: [test-pixi, test-conda]
    # Only publish on tags starting with v (e.g., v1.0.0)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          run-install: false

      - name: Publish to prefix.dev
        run: |
          pixi publish --target-channel https://prefix.dev/remote-sensing
