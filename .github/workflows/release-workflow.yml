name: CI & Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Install (${{ matrix.os }} - ${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-64
          - os: macos-14
            platform: osx-64
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          miniconda-version: "latest"
          channels: conda-forge,defaults

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          run-install: true

      - name: Build Local Channel
        shell: bash -l {0}
        run: ./tests/build_local_channel.sh

      - name: Run Pixi Test
        shell: bash -l {0}
        run: ./tests/test_pixi.sh ${{ matrix.platform }} $(pwd)/tests/test_output/local_channel

      - name: Run Conda Test
        shell: bash -l {0}
        run: ./tests/test_conda.sh ${{ matrix.platform }} $(pwd)/tests/test_output/local_channel

  build-and-publish:
    name: Publish to prefix.dev
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          run-install: false

      - name: Publish to prefix.dev
        run: |
          pixi publish --target-channel https://prefix.dev/remote-sensing
