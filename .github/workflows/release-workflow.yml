name: Publish to prefix.dev

on:
  push:
    tags:
      - 'v*' # Trigger automatically when a tag like v1.0.0 is pushed

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          run-install: false

      - name: Publish to prefix.dev
        run: |
          # pixi publish automatically builds and uploads using OIDC authentication
          pixi publish --target-channel https://prefix.dev/remote-sensing
